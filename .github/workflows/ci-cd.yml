name: CI/CD to Alibaba Cloud ACK

on:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限原则：GITHUB_TOKEN 默认可能拥有写权限，这里显式收敛为只读
permissions:
  contents: read

env:
  REGISTRY: crpi-6dyxb1942h81dqrf.cn-hangzhou.personal.cr.aliyuncs.com
  NAMESPACE: devops-project777
  IMAGE_NAME: web-app
  DOCKERFILE_PATH: ./app
  # 集群版本为 v1.36.1-aliyun.1。
  # 官方支持策略：kubectl 与集群版本相差不超过 ±1 个 minor。
  # 此前这里写死 v1.28.0，与集群相差 8 个 minor，属于不受支持的版本组合。
  KUBECTL_VERSION: v1.36.1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 供应链安全：第三方 action 一律 pin 到完整 commit SHA（2026-10 修复）
      # ------------------------------------------------------------
      # 浮动 tag（@v4 / @v3）本质是一个指向某个 commit 的【可变指针】。
      # 上游仓库维护者（或拿下其账号的攻击者）可以重新打 tag 让它指向恶意代码，
      # 而 CI 恰好是唯一同时握有 ACR 凭据和集群 kubeconfig 的地方 ——
      # 一旦被投毒，损失是整条发布链。
      #
      # pin 到 40 位 SHA 后指针不可变，版本号写在行尾注释里保证可读性，
      # 后续用 Dependabot 自动提 PR 更新 SHA，不会增加维护负担。
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # ============================================================
      # 镜像仓库登录
      # ------------------------------------------------------------
      # ⚠️ 已知遗留风险（TODO，见 README 演进路线）：
      #   这里用的是 ACR 长期用户名/密码，存在三点不足：
      #     ① 无法自动轮换 —— 一旦泄露永久有效
      #     ② 权限粒度粗   —— 做不到按命名空间隔离
      #     ③ 缺乏审计粒度 —— 无法区分是哪个流水线在拉推镜像
      #   演进路线：
      #     - 短期：改用【仅用于推送】的独立机器人账号，与人工账号分离
      #     - 中期：GitHub OIDC 换取阿里云临时 STS 凭证，彻底消灭静态密码
      #     - K8s 侧：ACK 的 ACR 免密拉取（RRSA），worker 用节点 RAM 角色拉镜像，
      #               集群里不再留存任何 imagePullSecrets
      # ============================================================
      - name: Login to ACR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ============================================================
      # 构建与推送（2026-10 变更：不再推送 :latest）
      # ------------------------------------------------------------
      # :latest 是反模式，两个具体问题：
      #   ① 不可复现 —— 看到 latest 无法得知跑的是哪次提交
      #   ② 默认 imagePullPolicy: IfNotPresent 下，节点本地若已存在同名 latest
      #      就不会重新拉取 —— 结果是同一个 Service 的不同后端跑着不同版本，
      #      而 kubectl get pods 显示的镜像名完全一样，这类问题最难排查。
      # 只推 :${GITHUB_SHA}，每个 tag 唯一且可直接追溯到具体 commit。
      # ============================================================
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -f ${{ env.DOCKERFILE_PATH }}/Dockerfile \
            ${{ env.DOCKERFILE_PATH }}

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      # ============================================================
      # 配置 kubeconfig（2026-10 安全修复）
      # ------------------------------------------------------------
      # 旧写法：
      #     run: |
      #       echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config     ← 危险
      #
      # 问题在于 ${{ }} 不是 shell 变量 —— 它是 GitHub Actions 在【YAML 解析阶段】
      # 做的字符串插值：secret 的值会被原样拼进【脚本文本】，然后整段交给 shell 执行。
      # 也就是说，secret 的内容成了“代码”，而不是“数据”。
      #
      # kubeconfig 里必然包含 client-certificate-data / token / CA 数据，
      # 只要值里出现反引号、`$(...)`、双引号或换行，就能闭合前面的引号并执行任意命令。
      # GitHub 官方文档明确警告过这种写法（Script injection / untrusted input）。
      #
      # 另外别指望日志脱敏兜底：GitHub 只对 secret 的原始值做 masking（打 ***），
      # 一旦值被换行拆分、base64 编码或拼接，mask 就失效了。
      #
      # 正确做法：
      #   - 通过 env: 传参：环境变量走进程环境，不经过 shell 语法解析
      #   - 引用时加双引号，并用 printf '%s' 而不是 echo（echo 会解释转义符）
      #
      # 权限建议（与本流水线无关，属配置侧）：
      #   secrets.KUBECONFIG 绑定的 ServiceAccount 应只拥有目标 namespace 的
      #   deploy 权限，绝不能是 cluster-admin。
      # ============================================================
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          unset KUBE_CONFIG_DATA
          echo "kubeconfig 已就位（$HOME/.kube/config）"

      # ============================================================
      # 连通性与版本 skew 校验
      # ------------------------------------------------------------
      # 在 apply 之前先确认连得上集群，否则后面的失败日志会非常难读。
      # 同时把 kubectl / apiserver 的版本差打出来，超出 ±1 minor 时给 warning。
      # ============================================================
      - name: Verify cluster connectivity and version skew
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          kubectl version -o json > /tmp/kube-version.json
          python3 - <<'PY'
          import json

          d = json.load(open('/tmp/kube-version.json'))

          def minor(v):
              digits = ''.join(ch for ch in v.get('minor', '0') if ch.isdigit())
              return int(digits or 0)

          client = d.get('clientVersion', {})
          server = d.get('serverVersion', {})
          print('kubectl   :', client.get('gitVersion'))
          print('apiserver :', server.get('gitVersion'))

          skew = abs(minor(client) - minor(server))
          print(f'version skew = {skew} minor(s)')
          if skew > 1:
              print('::warning::kubectl 与集群相差超过 1 个 minor，超出官方支持范围，'
                    '请调整 env.KUBECTL_VERSION 使其对齐集群版本')
          else:
              print('version skew 在官方支持的 ±1 minor 范围内')
          PY
          kubectl cluster-info

      # ============================================================
      # 部署（2026-10 重构：单次滚动更新 + 失败自动回滚）
      # ------------------------------------------------------------
      # 旧实现有两个问题：
      #
      # ① 一次 push = 两次滚动更新，中间还夹着版本回退
      #      kubectl apply -f k8s/ 会先把镜像强制恢复成 deployment.yaml 里写死的 :v1.0
      #        → 第一次滚动更新，集群短暂回到老版本
      #      kubectl set image ... :${GITHUB_SHA}
      #        → 第二次滚动更新
      #      第一次的结果既没人等也没人验，第二次叠加在上面，状态混乱。
      #      更致命的是：Git 里写 :v1.0、集群实际跑 :sha，两者永久不一致。
      #      任何一次人工 kubectl apply（回滚、重建集群）都会把生产打回 v1.0。
      #
      # ② 失败无回滚
      #      rollout status 超时后流水线直接红，"旧版本可能已经滚了一半"，
      #      集群停在“新老混合、副本不足”的降级状态，等人工半夜爬起来 undo。
      #
      # 新实现：
      #   - 先把 deployment.yaml 的镜像渲染成本次 sha 到 .render/，再整体 apply；
      #     一次 push 只触发一次滚动更新，且 Git 与集群不再产生 configuration drift
      #   - 失败自动 rollout undo 并等待回滚完成，再以非 0 退出让流水线标红
      #   - change-cause 注解让 kubectl rollout history 能看出每个 revision
      #     对应哪次提交，回滚时能选对版本
      # ============================================================
      - name: Deploy to ACK (single rollout + auto rollback)
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"

          IMAGE="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "target image: ${IMAGE}"

          mkdir -p .render
          # 只替换容器 image 行（锚定行首空白，避免误伤注释中的说明文字）
          sed -E "s|^([[:space:]]*)image:.*|\1image: ${IMAGE}|" \
            k8s/deployment.yaml > .render/deployment.yaml
          cp k8s/service.yaml k8s/ingress.yaml .render/

          echo "--- 渲染后的镜像（留痕便于审计）---"
          grep -n "image:" .render/deployment.yaml

          kubectl apply -f .render/

          kubectl annotate deployment/web-app \
            kubernetes.io/change-cause="${GITHUB_SHA::7} $(git log -1 --pretty=%s)" \
            --overwrite

          if ! kubectl rollout status deployment/web-app --timeout=5m; then
            echo "::error::发布失败，正在自动回滚到上一个可用版本"
            kubectl describe deployment/web-app || true
            kubectl get pods -l app=web-app -o wide || true
            kubectl rollout undo deployment/web-app
            kubectl rollout status deployment/web-app --timeout=3m
            exit 1
          fi

          echo "::notice::发布成功"

      - name: Verify deployment
        run: |
          export KUBECONFIG="$HOME/.kube/config"
          echo "========== Pods =========="
          kubectl get pods -o wide
          echo ""
          echo "========== Deployments =========="
          kubectl get deployments
          echo ""
          echo "========== Service / Endpoints =========="
          kubectl get svc
          kubectl get endpoints web-app-service
          echo ""
          echo "========== Ingress =========="
          kubectl get ingress
          echo ""
          echo "========== Rollout history =========="
          kubectl rollout history deployment/web-app || true
