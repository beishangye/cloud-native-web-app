name: CI/CD to Alibaba Cloud ACK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: crpi-6dyxb1942h81dqrf.cn-hangzhou.personal.cr.aliyuncs.com
  NAMESPACE: devops-project777
  IMAGE_NAME: web-app
  DOCKERFILE_PATH: ./app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest \
            -f ${{ env.DOCKERFILE_PATH }}/Dockerfile \
            ${{ env.DOCKERFILE_PATH }}

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # ============================================================
      # ✅ 修复：先创建/更新资源，再更新镜像
      # ============================================================
      - name: Deploy to ACK
        run: |
          # 1. 创建或更新 K8s 资源
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          
          # 2. 更新镜像版本
          kubectl set image deployment/web-app \
            web-app=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          # 3. 等待部署完成
          kubectl rollout status deployment/web-app --timeout=5m

      - name: Verify deployment
        run: |
          echo "========== Pods =========="
          kubectl get pods
          echo ""
          echo "========== Deployments =========="
          kubectl get deployments
          echo ""
          echo "========== Services =========="
          kubectl get svc
          echo ""
          echo "========== Ingress =========="
          kubectl get ingress